<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Memory for Human — a local memoir workspace, guided by your own AI.">
  <title>Memory for Human</title>
  <link rel="stylesheet" href="app/styles.css?v=b9115715973d">
  <link rel="stylesheet" href="app/edition.css?v=6af448c2727c">
  <link rel="stylesheet" href="app/chapter-finder.css?v=1dbc4d521735">
  <script src="app/core.js?v=1abf0f132bf9" defer></script>
  <script src="app/i18n.js?v=0e5cefacbdbb" defer></script>
  <script src="app/app.js?v=07837363ce69" defer></script>
</head>
<body class="private-edition">
  <a class="skip-link" href="#main" data-i18n="skipToWork"></a>
  <header class="header"><div class="header-inner">
    <button class="brand quiet" data-action="desk"><span class="brand-mark" aria-hidden="true">m.</span><span>Memory for Human<small data-i18n="editionLabel"></small></span></button>
    <div class="project-row"><label for="projects" class="sr-only" data-i18n="books"></label><select id="projects" class="project-select"></select><button class="quiet small" data-action="new" data-i18n="newBook"></button></div>
    <div class="header-actions"><select id="language" aria-label="Language / 语言 / Idioma"><option value="zh">简体中文</option><option value="en">English</option><option value="es">Español</option></select>
      <details id="workspaceTools" class="workspace-tools"><summary data-i18n="workspaceTools"></summary><div class="tools-menu">
        <button class="quiet" data-action="help" data-i18n="help"></button><button class="quiet" data-action="handoff" data-i18n="handoff"></button>
        <div class="connection"><span id="connectionDot" class="status-dot"></span><span id="connectionStatus"></span></div><button data-action="connect" id="connectionButton" data-i18n="connect"></button>
      </div></details>
    </div>
  </div></header>
  <div class="layout">
    <aside class="sidebar"><p class="rail-caption" data-i18n="worktable"></p>
      <nav class="steps" aria-label="Memoir steps">
        <button class="step active" data-step="0"><b aria-hidden="true">01</b><span data-i18n="navBook"></span></button>
        <button class="step" data-step="1"><b aria-hidden="true">02</b><span data-i18n="navStories"></span></button>
        <button class="step" data-step="2"><b aria-hidden="true">03</b><span data-i18n="navWriting"></span></button>
        <button class="step" data-step="3"><b aria-hidden="true">04</b><span data-i18n="navEdition"></span></button>
      </nav><p class="rail-note" data-i18n="editionRailNote"></p>
    </aside>
    <main id="main" tabindex="-1">
      <div class="workspace-state"><span id="stageLabel" class="eyebrow"></span><div id="saveStatus" class="save-state" role="status" aria-live="polite"></div></div>
      <section id="saveRecovery" class="save-recovery" aria-labelledby="saveRecoveryTitle" hidden>
        <p id="saveRecoveryTitle" role="alert" data-i18n="saveRecoveryHint"></p>
        <div class="row"><button id="retrySave" data-action="retrySave" data-i18n="retrySave"></button><button data-action="backup" data-i18n="backup"></button></div>
      </section>
      <section id="workspacePanel">
        <section class="card book-desk" data-panel="0">
          <div class="desk-spread">
            <div class="desk-intro"><p class="eyebrow" data-i18n="editionLabel"></p><h1 id="deskHeading"></h1><p id="deskHint" class="desk-hint"></p>
              <div id="welcome"><p data-i18n="deskWelcome"></p></div>
              <button id="continueBook" class="primary desk-continue" data-action="continueBook"></button>
              <button class="quiet demo-link" data-action="demo" data-i18n="demo"></button>
              <p id="deskCounts" class="desk-counts"></p>
            </div>
            <div class="book-cover"><span class="cover-edition" data-i18n="editionLabel"></span><div class="cover-title"><label for="bookTitle" data-i18n="bookTitle"></label><textarea id="bookTitle" rows="3" maxlength="300" data-placeholder="coverTitlePlaceholder" spellcheck="false"></textarea></div><div class="cover-rule" aria-hidden="true"></div><span id="coverAuthor"></span><span class="cover-imprint">Memory for Human</span></div>
          </div>
          <section class="desk-contents" aria-labelledby="deskContentsTitle"><div class="desk-section-head"><h2 id="deskContentsTitle" data-i18n="deskContents"></h2><button class="quiet" data-action="openArchive" data-i18n="openArchive"></button></div><p id="deskEmpty" class="hint" data-i18n="deskEmpty"></p><ol id="deskChapterList"></ol></section>
          <details id="bookSettings" class="book-settings"><summary data-i18n="bookSettings"></summary><div class="settings-content">
          <div class="section-head"><h2 data-i18n="scene"></h2><p class="hint" data-i18n="guide"></p></div><div id="scenes" class="scene-grid"></div>
          <div class="grid">
            <div class="field"><label for="person" data-i18n="person"></label><input id="person" maxlength="300" data-placeholder="personPlaceholder"></div>
            <div class="field"><label for="reader" data-i18n="reader"></label><input id="reader" maxlength="300" data-placeholder="readerPlaceholder"></div>
          </div>
          <div class="field"><label for="target" data-i18n="length"></label><select id="target"><option value="short" data-i18n="lengths.short"></option><option value="medium" data-i18n="lengths.medium"></option><option value="long" data-i18n="lengths.long"></option></select><p class="hint" data-i18n="lengthHint"></p></div>
          </div></details>
        </section>
        <section class="card editorial-sources" data-panel="1" hidden>
          <div class="story-switch" role="group" data-i18n-label="storyWorkspace"><button id="interviewTab" data-action="showInterview" data-i18n="interviewTab" aria-pressed="true"></button><button id="archiveTab" data-action="showArchive" data-i18n="archiveTab" aria-pressed="false"></button></div>
          <div id="interviewView">
          <div class="section-head"><h2 data-i18n="storyTitle"></h2><p class="hint" data-i18n="storyHint"></p></div>
          <div class="question-box"><small data-i18n="question"></small><p id="questionText"></p></div>
          <div class="field"><label for="answer" data-i18n="answerLabel"></label><textarea id="answer" class="answer-text" data-placeholder="answerPlaceholder"></textarea></div>
          <div class="row spaced interview-actions"><button class="primary" data-action="saveAnswer" data-i18n="saveAnswer"></button><button data-action="skip" data-i18n="skip"></button></div>
          <details id="interviewTools" class="interview-tools"><summary data-i18n="interviewTools"></summary><div class="row"><button data-action="askAI" data-ai data-i18n="askAI"></button><button class="quiet" id="voiceButton" data-action="voice" data-i18n="voice"></button></div><p class="hint" data-i18n="voiceNote"></p></details>
          <div class="interview-next"><span data-i18n="interviewNextHint"></span><button class="quiet" data-action="goWriting" data-i18n="goWriting"></button></div>
          </div><div id="archiveView" hidden><div class="section-head"><p class="eyebrow" data-i18n="archiveTab"></p><h2 data-i18n="archiveTitle"></h2><p class="hint" data-i18n="archiveHint"></p></div>
          <div class="subsection" id="sourceLibrary">
            <label for="sourceSearch" class="source-search-label" data-i18n="findSources"></label>
            <div class="source-search-row"><input id="sourceSearch" type="search" autocomplete="off" data-placeholder="sourceSearchPlaceholder" aria-controls="answers materials" aria-describedby="sourceSearchHint sourceSearchStatus"><button id="clearSourceSearch" data-i18n="clearSourceSearch" disabled></button></div>
            <p class="hint" id="sourceSearchHint" data-i18n="sourceSearchHint"></p>
            <p class="source-search-status" id="sourceSearchStatus" role="status" aria-live="polite" aria-atomic="true"></p>
            <h3 class="source-group-title" data-i18n="memories"></h3><div id="answers"></div>
          </div>
          <div class="subsection"><h3 data-i18n="materials"></h3><p class="hint" data-i18n="materialHint"></p><div class="row"><button data-action="addText" data-i18n="addText"></button><button data-action="importText" data-i18n="importText"></button></div><p class="hint" data-i18n="fileHint"></p><div id="materials"></div></div>
          <p class="notice" data-i18n="sendNotice"></p>
          </div>
        </section>
        <section class="card editorial-writing" data-panel="2" hidden>
          <div class="section-head"><p class="eyebrow" data-i18n="step3"></p><h2 id="writingBookTitle"></h2></div>
          <div class="chapter-toolbar"><span id="writingChapterPosition" class="chapter-position"></span><select id="chapters" aria-label="Chapter"></select><button id="chapterFinderButton" class="small" data-action="findChapter" data-i18n="findChapter" disabled></button><button class="small" id="focusChapterButton" data-action="focusChapter" data-i18n="focusChapter" hidden></button><button class="small" data-action="newChapter" data-i18n="newChapter"></button><span id="writingSaveStatus" class="writing-save-state" aria-hidden="true"></span></div>
          <p id="noChapter" class="empty" data-i18n="noChapters"></p>
          <button id="returnToExport" class="quiet small manuscript-return" data-action="returnToExport" data-i18n="exportReturn" hidden></button>
          <div id="chapterEditor" tabindex="-1" hidden>
            <div class="row"><span class="badge" id="chapterStatus"></span><span class="hint" id="chapterOrigin"></span></div>
            <div class="field"><label for="editChapterTitle" data-i18n="chapterTitle"></label><input id="editChapterTitle" maxlength="300"></div>
            <div class="field"><label for="chapterText" data-i18n="draftLabel"></label><textarea id="chapterText" class="chapter-text"></textarea></div>
            <div class="row spaced"><p id="reviewSendNotice" class="review-send-notice" data-i18n="sendNotice"></p><button data-action="reviewAI" data-ai data-i18n="reviewAI" aria-describedby="reviewSendNotice"></button><button class="primary" id="approvalButton" data-action="approve"></button><button class="quiet danger small" data-action="deleteChapter" data-i18n="remove"></button></div>
            <section id="reviewPanel" class="subsection" hidden><h3 data-i18n="reviewResult"></h3><div id="reviewOutput" class="review-output"></div></section>
          </div>
          <div id="chapterEditorAnchor" hidden></div>
          <details id="chapterComposer" class="chapter-composer" open>
            <summary data-i18n="organizeChapter"></summary>
            <div class="composer-content">
              <div class="field"><label for="nextChapterTitle" data-i18n="chapterTitle"></label><input id="nextChapterTitle" maxlength="300" data-placeholder="chapterPlaceholder"></div>
              <div id="organizerPrimary" class="row spaced"></div>
              <details class="other-methods"><summary data-i18n="otherMethods"></summary><div id="organizerAlternatives" class="row spaced"><button id="writingAIButton" class="primary" data-action="writeAI" data-ai data-i18n="writeAI"></button><button id="writingLocalButton" data-action="collect" data-i18n="collect"></button><button data-action="pasteDraft" data-i18n="pasteDraft"></button></div></details>

          <p class="notice" data-i18n="sendNotice"></p>
            </div>
          </details>
        </section>
        <section class="card editorial-export" data-panel="3" hidden>
          <div class="section-head"><h2 data-i18n="exportTitle"></h2><p class="hint" data-i18n="exportHint"></p></div>
          <section id="exportOverview" class="manuscript-overview" tabindex="-1" aria-labelledby="exportOverviewHeading">
            <h3 id="exportOverviewHeading" class="manuscript-eyebrow" data-i18n="exportOverview"></h3>
            <p id="exportBookTitle" class="manuscript-title"></p>
            <p id="exportCounts" class="manuscript-counts" role="status" aria-live="polite" aria-atomic="true"></p>
            <p id="exportReviewNote" class="manuscript-note"></p>
            <button id="checkNextDraft" class="manuscript-check" data-action="inspectExportChapter" data-i18n="exportCheckNext" hidden></button>
            <details id="exportDirectory" class="manuscript-directory" hidden>
              <summary><span id="exportDirectoryLabel" data-i18n="exportDirectory"></span><span class="manuscript-chevron" aria-hidden="true">›</span></summary>
              <ol id="exportChapterList" class="manuscript-chapters" tabindex="0" aria-labelledby="exportDirectoryLabel"></ol>
            </details>
            <p class="manuscript-scope" data-i18n="exportScope"></p>
          </section>
          <div class="export-option"><div><h3 data-i18n="backup"></h3><p class="hint" data-i18n="backupHint"></p></div><button class="primary" data-action="backup" data-i18n="backup"></button></div>
          <div class="export-option"><div><h3 data-i18n="restore"></h3><p class="hint" data-i18n="restoreHint"></p></div><button data-action="restore" data-i18n="restore"></button></div>
          <div class="export-option"><div><h3 data-i18n="exportMD"></h3><p class="hint" data-i18n="exportMDHint"></p></div><button data-action="exportMD" data-i18n="exportMD"></button></div>
          <div class="export-option"><div><h3 data-i18n="print"></h3><p class="hint" data-i18n="printHint"></p></div><button data-action="print" data-i18n="print"></button></div>
          <p class="hint" data-i18n="printing"></p>
          <div class="subsection"><h3 data-i18n="bom"></h3><ol id="checklist" class="checklist"></ol><a id="productionLink" class="help-link" href="preview/guide.html#production" target="_blank" data-i18n="productionDoc"></a></div>
        </section>
        <div class="bottom-nav"><button class="quiet" data-action="back" id="backButton" data-i18n="back"></button><button class="primary" data-action="next" id="nextButton" data-i18n="next"></button></div>
      </section>
      <section class="card" id="helpPanel" hidden>
        <div class="section-head"><h1 data-i18n="explanationTitle"></h1><p class="hint" data-i18n="explanationIntro"></p></div>
        <div id="faqButtons" class="help-questions"></div><div id="faqAnswer" class="help-answer"></div>
        <div class="subsection"><div class="field"><label for="explainQuestion" data-i18n="explainQuestion"></label><input id="explainQuestion" maxlength="3000" data-placeholder="explainPlaceholder"></div><button class="primary spaced" data-action="explainAI" data-ai data-i18n="explainAI"></button><div id="explainOutput" class="review-output" hidden></div></div>
        <div class="row spaced"><button data-action="workspace" data-i18n="myBook"></button><button data-action="handoff" data-i18n="handoff"></button></div>
      </section>
      <section class="card" id="handoffPanel" hidden>
        <div class="section-head"><h1 data-i18n="handoffTitle"></h1><p class="hint" data-i18n="handoffIntro"></p></div>
        <div class="field"><label for="handoffTask" data-i18n="handoffTask"></label><select id="handoffTask"><option value="interview" data-i18n="tasks.interview"></option><option value="draft" data-i18n="tasks.draft"></option><option value="review" data-i18n="tasks.review"></option><option value="setup" data-i18n="tasks.setup"></option></select></div>
        <label class="material-choice"><input id="handoffInclude" type="checkbox"><span data-i18n="includeMemories"></span></label>
        <p class="hint" data-i18n="handoffPrivacy"></p><textarea id="handoffText" class="handoff-text" readonly aria-label="AI instructions"></textarea>
        <div class="row spaced"><button class="primary" data-action="copyHandoff" data-i18n="copyInstructions"></button><button data-action="downloadHandoff" data-i18n="downloadInstructions"></button></div>
        <p class="hint" data-i18n="handoffFormat"></p>
        <div class="field"><label for="returnedAI" data-i18n="returnedAI"></label><textarea id="returnedAI" class="return-result" data-placeholder="returnedHint"></textarea></div>
        <button class="primary spaced" data-action="importResult" data-i18n="importResult"></button>
      </section>
      <div id="busyLine" class="busy-line" role="status" hidden data-i18n="busy"></div>
      <footer class="footnote"><span data-i18n="localHint"></span> · <a id="readmeLink" href="preview/README.html" target="_blank" data-i18n="moreDoc"></a></footer>
    </main>
  </div>
  <dialog id="chapterFocusDialog" class="chapter-focus" aria-labelledby="focusTitle">
    <header class="focus-header">
      <div><h2 id="focusTitle" tabindex="-1" data-i18n="focusChapter"></h2><p id="focusSaveStatus" class="save-state" role="status" aria-live="polite"></p></div>
      <div class="focus-tools">
        <details id="focusHelp" class="focus-help"><summary data-i18n="focusHelp"></summary><p id="focusHint" data-i18n="focusHint"></p></details>
        <button data-close="chapterFocusDialog" class="focus-return"><span aria-hidden="true">←</span> <span data-i18n="returnToChapters"></span></button>
      </div>
    </header>
    <div class="focus-page">
      <div id="focusEditorSlot"></div>
      <p class="focus-end" data-i18n="focusReviewHint"></p>
    </div>
  </dialog>
  <dialog id="connectionDialog">
    <div class="dialog-head"><h2 data-i18n="connectionTitle"></h2><button class="quiet small" data-close="connectionDialog" data-i18n="close"></button></div>
    <p class="hint" data-i18n="connectionHint"></p>
    <div id="fileMode" class="notice" hidden><p data-i18n="fileMode"></p><a href="http://127.0.0.1:4317" data-i18n="openLocal"></a></div>
    <form id="connectionForm">
      <div class="field"><label for="provider" data-i18n="provider"></label><select id="provider"><option value="openai">OpenAI</option><option value="deepseek">DeepSeek</option><option value="anthropic">Claude</option><option value="doubao">豆包 / Doubao</option><option value="custom" data-i18n="customProvider"></option></select></div>
      <div class="field"><label for="apiKey" data-i18n="apiKey"></label><input id="apiKey" type="password" autocomplete="off" spellcheck="false" data-placeholder="keyPlaceholder"></div>
      <details id="advanced"><summary data-i18n="advanced"></summary><div class="field"><label for="model" data-i18n="model"></label><input id="model" maxlength="200"><p class="hint" data-i18n="modelHint"></p></div><div class="field"><label for="baseURL" data-i18n="baseURL"></label><input id="baseURL" type="url" maxlength="500"></div></details>
      <p class="hint" data-i18n="connectionNote"></p><p id="connectionError" class="notice" role="alert" hidden></p>
      <div class="row spaced"><button id="connectSubmit" class="primary" type="submit" data-i18n="connectButton"></button><button type="button" data-action="disconnect" data-i18n="disconnect"></button></div>
    </form>
  </dialog>
  <dialog id="materialDialog"><div class="dialog-head"><h2 data-i18n="addText"></h2><button class="quiet small" data-close="materialDialog" data-i18n="close"></button></div><form id="materialForm"><div class="field"><label for="materialName" data-i18n="materialName"></label><input id="materialName" maxlength="300" required></div><div class="field"><label for="materialContent" data-i18n="materialContent"></label><textarea id="materialContent" rows="10" required></textarea></div><button class="primary spaced" data-i18n="add"></button></form></dialog>
  <dialog id="editAnswerDialog"><div class="dialog-head"><h2 data-i18n="edit"></h2><button class="quiet small" data-close="editAnswerDialog" data-i18n="close"></button></div><form id="editAnswerForm"><div class="field"><label for="editQuestion" data-i18n="question"></label><textarea id="editQuestion" rows="2"></textarea></div><div class="field"><label for="editAnswer" data-i18n="answerLabel"></label><textarea id="editAnswer" rows="10"></textarea></div><button class="primary spaced" data-i18n="saveAnswer"></button></form></dialog>
  <dialog id="chapterFinder" class="chapter-finder" aria-labelledby="chapterFinderTitle" aria-describedby="chapterFinderHint">
    <div class="dialog-head"><div><p class="finder-eyebrow" data-i18n="chapterContents"></p><h2 id="chapterFinderTitle" data-i18n="findChapter"></h2></div><button class="quiet small" data-close="chapterFinder" data-i18n="close"></button></div>
    <p id="chapterFinderHint" class="hint" data-i18n="chapterFinderHint"></p>
    <label class="finder-label" for="chapterQuery" data-i18n="chapterQueryLabel"></label>
    <div class="finder-search"><input id="chapterQuery" type="search" autocomplete="off" data-placeholder="chapterQueryPlaceholder"><button id="clearChapterQuery" class="quiet small" data-i18n="clearChapterQuery"></button></div>
    <p id="chapterMatches" class="finder-count" role="status" aria-live="polite" aria-atomic="true"></p>
    <ol id="chapterMatchesList" class="finder-list"></ol>
    <p id="noChapterMatches" class="empty" data-i18n="noChapterMatches" hidden></p>
  </dialog>
  <dialog id="interviewDraftDialog" aria-labelledby="interviewDraftTitle" aria-describedby="interviewDraftHint">
    <h2 id="interviewDraftTitle" data-i18n="draftBeforeQuestion"></h2>
    <p id="interviewDraftHint" data-i18n="draftBeforeQuestionHint"></p>
    <blockquote id="interviewDraftQuestion" class="draft-question"></blockquote>
    <p id="interviewDraftStatus" class="hint" role="status" aria-live="polite"></p>
    <div class="row spaced"><button id="keepInterviewDraft" data-close="interviewDraftDialog" data-i18n="keepInterviewDraft"></button><button id="saveInterviewDraft" class="primary" data-i18n="saveInterviewDraft"></button></div>
  </dialog>
  <input type="file" id="textFile" accept=".txt,.md,.csv,.json" multiple hidden>
  <input type="file" id="backupFile" accept=".json" hidden>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <section id="printView" class="print-view"></section>
  <noscript><p>请允许 JavaScript 运行。Please enable JavaScript. Activa JavaScript.</p></noscript>
</body>
</html>
